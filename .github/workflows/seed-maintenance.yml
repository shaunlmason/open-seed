# seed-maintenance (live, deterministic — no model secrets; §7.3/D7).
# Runs under the workflow's operator credential ("seed-maintenance", in the
# .seed/config.toml roster). Scheduled off the hour (aeon debt-model: assume
# missed ticks). Order matters: reap → unblock → close → lint (halts on
# conformance failure, stopping the job before anchoring bad state) → anchor.
name: seed-maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  checks: read
  issues: write # mirror export (gh issue create/edit/close)

concurrency: seed-maintenance

jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      ACTOR: seed-maintenance
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip when no state ref exists, or the backend is machine-local
        id: gate
        run: |
          # A machine-local backend (fastcards: state_portability=machine)
          # keeps its state in a local DB that CI can never see — the whole
          # maintenance lane is the operator's local job there, and a stale
          # seed-state ref left over from a filecards migration must not
          # reactivate it (every step, anchor first, would fail).
          backend=$(sed -n 's/^backend *= *"\(.*\)"/\1/p' .seed/config.toml | head -1)
          portability=$(sed -n 's/^state_portability *= *"\(.*\)"/\1/p' ".seed/backends/${backend:-filecards}/backend.toml" 2>/dev/null | head -1)
          if [ "$portability" = "machine" ]; then
            echo "backend '$backend' is machine-local — maintenance runs locally (see its README); skipping"
            echo "active=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code origin seed-state >/dev/null 2>&1; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "no seed-state ref — run scripts/seed init first"; echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reap expired leases (handoff stubs, §7.1)
        if: steps.gate.outputs.active == 'true'
        run: scripts/seed maintain reap --actor "$ACTOR"

      - name: Plan-unblock (state-shaped — PR merged or closed, D1)
        if: steps.gate.outputs.active == 'true'
        run: |
          for id in $(scripts/seed task list --state blocked | jq -r '.tasks[].task'); do
            for entry in $(scripts/seed task get "$id" | jq -r '.card.blocked_on[]? | select(startswith("plan:"))'); do
              pr="${entry#plan:}"
              state=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state -q .state 2>/dev/null || echo UNKNOWN)
              if [ "$state" = "MERGED" ] || [ "$state" = "CLOSED" ]; then
                scripts/seed task plan-unblock "$id" --pr "$pr" --actor "$ACTOR"
              fi
            done
          done

      - name: Close merged task PRs (accept + cascade after merge, §7.1)
        if: steps.gate.outputs.active == 'true'
        run: |
          for id in $(scripts/seed task list --state review | jq -r '.tasks[].task'); do
            pr_json=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "seed/$id" --state merged \
              --json number,url,headRefOid --limit 1)
            [ "$(echo "$pr_json" | jq length)" = "1" ] || continue
            url=$(echo "$pr_json" | jq -r '.[0].url')
            sha=$(echo "$pr_json" | jq -r '.[0].headRefOid')
            verify=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=verify" \
              -q '.check_runs[0].conclusion' 2>/dev/null || echo missing)
            if [ "$verify" = "success" ]; then
              scripts/seed task close "$id" --actor "$ACTOR" --resolution "$url"
            else
              echo "skip $id: merged PR $url but verify check is '$verify'"
            fi
          done

      - name: Mirror export (one-way, D1 — only when [mirror] enabled)
        if: steps.gate.outputs.active == 'true'
        run: |
          enabled=$(awk '/^\[mirror\]/{m=1} m && /^enabled/{print $3; exit}' .seed/config.toml)
          [ "$enabled" = "true" ] || { echo "mirror disabled ([mirror] enabled=false)"; exit 0; }
          # Provision the D1 state labels idempotently (a fresh repo has none).
          for s in ready in_progress review done blocked; do
            gh label create "seed:$s" --repo "$GITHUB_REPOSITORY" --color 5319e7 \
              --description "seed mirror state" --force || true
          done
          state_labels="seed:ready,seed:in_progress,seed:review,seed:done,seed:blocked"
          scripts/seed mirror plan | jq -c '.actions[]' | while read -r a; do
            op=$(echo "$a" | jq -r .op); card=$(echo "$a" | jq -r .card)
            title=$(echo "$a" | jq -r .title); issue=$(echo "$a" | jq -r .issue)
            labels=$(echo "$a" | jq -r '.labels | join(",")')
            exported=$(echo "$a" | jq -r 'if .close_reason=="not_planned" then "cancelled"
              elif .state=="closed" then "done"
              elif (.labels|length)==0 then "backlog"
              else (.labels[0] | ltrimstr("seed:")) end')
            # Record an export only after every gh mutation for it succeeded —
            # a failed mutation must leave the card planned for the next tick.
            ok=1
            case "$op" in
              create)
                echo "$a" | jq -r .body > /tmp/mirror-body.md
                n=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                    --body-file /tmp/mirror-body.md ${labels:+--label "$labels"} \
                    | sed -n 's#.*/issues/\([0-9]*\)$#\1#p') || ok=0
                [ -n "$n" ] || ok=0
                issue="$n"
                ;;
              update)
                gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --title "$title" \
                  --remove-label "$state_labels" || ok=0
                if [ -n "$labels" ]; then
                  gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label "$labels" || ok=0
                fi
                ;;
              close)
                reason=$(echo "$a" | jq -r '.close_reason | sub("_"; " ")')
                gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --remove-label "$state_labels" || ok=0
                if [ -n "$labels" ]; then
                  gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label "$labels" || ok=0
                fi
                gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason "$reason" || ok=0
                ;;
            esac
            if [ "$ok" = "1" ] && [ -n "$issue" ]; then
              scripts/seed mirror record "$card" --issue "$issue" --state "$exported" --actor "$ACTOR" \
                || echo "record failed for $card (will re-plan next tick)"
            else
              echo "export incomplete for $card (op=$op) — leaving unrecorded for retry"
            fi
          done

      - name: Conformance lint (writes HALT on failure, §7.2)
        if: steps.gate.outputs.active == 'true'
        run: scripts/seed state lint --halt-on-fail --actor "$ACTOR"

      - name: Prune acked mail (bounded history, os-499c5978)
        if: steps.gate.outputs.active == 'true'
        run: scripts/seed mail prune

      - name: Anchor checkpoint tag
        if: steps.gate.outputs.active == 'true'
        run: scripts/seed state anchor

      - name: Report
        if: always() && steps.gate.outputs.active == 'true'
        run: |
          echo '## seed-maintenance report' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          scripts/seed maintain report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
