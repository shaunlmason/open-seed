# check+validate (live, deterministic, no model secrets; §7.3).
# The fast backpressure gate: make check + all validators, the state-ref lint,
# and, on task/plan PRs, the D3/D4.5 verify gate.
name: check-validate

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # A review posted AFTER the last push must re-run verify: the D4.5
  # identity check reads reviews at verify time, so without this trigger
  # a pre-review verify stays stale-red until an unrelated push
  # (os-70028620).
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: make check (validators + project checks)
        run: make check
      - name: 'Shared skills pinned (D8: skills install --frozen)'
        run: sh scripts/seed skills install --frozen
      - name: State-ref lint (read-only; reports, never halts here)
        run: scripts/seed state lint

  verify:
    # The receipt verify gate (D4.5): CI is the author of record. Runs for
    # pull_request and merge_group; on merge_group the PR number is derived
    # from the queue ref and classification uses the REAL head branch: a
    # queue ref must never classify as a non-task PR and pass vacuously (D3).
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve head branch
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT" = "merge_group" ]; then
            pr=$(echo "$GITHUB_REF" | sed -n 's#.*/pr-\([0-9]*\)-.*#\1#p')
            [ -n "$pr" ] || { echo "cannot derive PR from $GITHUB_REF"; exit 1; }
            branch=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
          elif [ "$EVENT" = "pull_request_review" ]; then
            branch="$REVIEW_HEAD"   # head_ref is unset on review events
          else
            branch="$HEAD_REF"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # classify prints "class=X task=Y" on one line; GITHUB_OUTPUT is
          # parsed per line, so split before appending.
          cls=$(scripts/seed pr classify "$branch")
          echo "$cls"
          echo "$cls" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
      - name: Verify task PR (receipt + purity + stale-plan)
        if: steps.head.outputs.class == 'task'
        env:
          BRANCH: ${{ steps.head.outputs.branch }}
          TASK: ${{ steps.head.outputs.task }}
        run: |
          scripts/seed receipt verify "$TASK" --base origin/main --branch "$BRANCH" --run
      - name: 'Reviewer identity (D4.5: reviewer differs from implementer)'
        if: github.event_name == 'pull_request_review' && steps.head.outputs.class == 'task'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          IMPLEMENTER: ${{ github.event.pull_request.user.login }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json reviews -q .reviews             | sh scripts/seed-review-identity || rc=$?
          # exit 2 = no qualifying approval yet: the required check stays
          # red until a non-implementer approval exists (D4.5): a
          # COMMENTED/CHANGES_REQUESTED review must not leave verify
          # green. exit 3 = self-approval, refused.
          exit "${rc:-0}"

      - name: Verify plan PR (purity + grammar)
        if: steps.head.outputs.class == 'plan'
        env:
          BRANCH: ${{ steps.head.outputs.branch }}
          TASK: ${{ steps.head.outputs.task }}
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref || 'main' }}...HEAD" | paste -sd, -)
          scripts/seed pr classify "$BRANCH" --files "$files"
          scripts/seed plan lint "plans/$TASK.md"
