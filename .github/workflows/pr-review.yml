# pr-review (INERT until activation, §7.3): the reviewer-agent lane. v1
# review is human-only; when the ANTHROPIC_API_KEY secret is added, this
# workflow reviews task PRs under its own server-attributed app identity —
# which must differ from the plan author (D4.5 identity rule).
name: pr-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Only seed task/plan PRs; drafts wait.
    if: startsWith(github.head_ref, 'seed/') && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Activation gate
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "inert: no ANTHROPIC_API_KEY secret — pr-review is scaffolding until activation; v1 review is human-only (§7.3)"
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: steps.gate.outputs.active == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--settings .claude/ci-settings.json --allowedTools Bash(scripts/seed:*),Bash(git diff:*),Bash(git log:*)"
          prompt: |
            You are the reviewer role: read .seed/agents/reviewer.md and
            follow it. Review this PR against the merge-base plan blob only
            (D3). Post your verdict as a REAL pull-request review
            (server-attributed to this workflow's app identity — the D4.5
            gate reads reviews, never comments); do not merge, and do not
            edit card state directly except `seed task reject` on a
            REQUEST_CHANGES verdict, which requires this app's identity in
            [operators].actors (see the activation runbook).
