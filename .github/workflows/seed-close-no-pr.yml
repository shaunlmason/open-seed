# The --no-pr close path (D7): for cards whose work never lands as a
# seed/<id> PR. Running via workflow_dispatch makes GitHub record the
# triggering actor server-side — the done-consistency lint validates against
# that artifact, never card text. The engine additionally requires the actor
# to be in the .seed/config.toml operator roster.
name: seed-close-no-pr

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task id (os-…), must be in review"
        required: true
      resolution:
        description: "Why this closes without a PR"
        required: true

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close with server-attributed evidence
        env:
          TASK: ${{ inputs.task }}
          RESOLUTION: ${{ inputs.resolution }}
          ACTOR: ${{ github.actor }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          scripts/seed task close "$TASK" --actor "$ACTOR" --no-pr \
            --resolution "$run_url — $RESOLUTION"
